services:
  lexus:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: lexus-service
    restart: unless-stopped
    environment:
      LEXUS_ALLOWED_ORIGINS: https://lexus.vaidya-gpt.com
      LEXUS_PUBLIC_URL: https://lexus.vaidya-gpt.com
      LEXUS_RELEASES_DIR: /downloads
      LEXUS_REQUIRE_LATEST_DESKTOP: "true"
    volumes:
      - /srv/lexus-data:/data
      - /srv/lexus-releases:/downloads:ro
    networks:
      - edge
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/api/license/state').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
networks:
  edge:
    external: true
